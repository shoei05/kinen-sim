<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#c5487b">
<title>禁煙外来シミュレーター</title>
<link rel="icon" href="img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap">
<meta name="description" content="返答を選ぶと、患者さんが声で答える。禁煙外来の初診を題材にした分岐型ロールプレイ。">
<style>
:root{--accent:#c5487b;--ink:#1f1d1e;--muted:#5d6468;--pinkbg:#f9eaf0;--bluebg:#e7f2f5;--blue:#3B9AB2;--lblue:#a9ccd6;--gold:#E1AF00;--line:#e3e6e8;--text:var(--ink);--sub:var(--muted)}
*{box-sizing:border-box}
html{background:#ebe9ea}
body{margin:0 auto;max-width:1920px;background:#fff;color:var(--ink);font-family:"BIZ UDPGothic","Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif;font-size:22.4px;height:100vh;height:100dvh;display:flex;flex-direction:column;box-shadow:0 0 0 1px #ddd}
header{display:flex;align-items:baseline;gap:16px;padding:0 24px;height:68px;background:var(--accent);color:#fff;flex:none}
header h1{font-size:26.6px;margin:0;letter-spacing:.06em;font-weight:700;line-height:52px;white-space:nowrap}header .sub{color:rgba(255,255,255,.88);font-size:18.2px}
main{flex:1;display:grid;grid-template-columns:340px 1fr 380px;grid-template-rows:minmax(0,1fr);min-height:0}
aside{border-right:1px solid var(--line);padding:16px;background:#fff;overflow-y:auto}
.who{display:flex;gap:10px;align-items:center;margin-bottom:12px}.av{width:44px;height:44px;border-radius:50%;object-fit:cover;background:#fff;border:2px solid var(--lblue)}
.bigav{display:block;width:auto;max-width:100%;height:30vh;object-fit:contain;margin:4px auto 10px;border-radius:16px;transition:opacity .3s;border:2px solid var(--lblue);background:#fff}
.row{display:flex;gap:8px;align-items:flex-start}.row.d{justify-content:flex-end}.mini{width:34px;height:34px;border-radius:50%;flex:none;border:2px solid var(--lblue);background:#fff;object-fit:cover}
.who b{display:block}.who small{color:var(--muted)}
.profile{font-size:18.2px;color:var(--muted);line-height:1.55}
#chat{display:flex;flex-direction:column;min-height:0;background:#fff}
#log{flex:1;overflow-y:auto;padding:18px 22px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:72%;padding:10px 16px;border-radius:16px;line-height:1.7;font-size:21px;position:relative;animation:pop .25s ease;color:var(--ink)}
.msg.p{align-self:flex-start;background:var(--bluebg);border-top-left-radius:4px}
.pcol{display:flex;flex-direction:column;align-items:flex-start;gap:4px;max-width:72%;min-width:0}.pcol .msg{max-width:100%}
.manner{font-size:16.8px;line-height:1.5;color:var(--muted);padding:0 4px;overflow-wrap:anywhere}
.msg.d{align-self:flex-end;background:var(--pinkbg);border-top-right-radius:4px}
.msg .tag{display:inline-block;font-size:15.4px;padding:1px 9px;border-radius:9px;margin-left:8px;background:var(--accent);color:#fff;vertical-align:middle;font-weight:700}
.tip{align-self:center;max-width:80%;font-size:18.2px;line-height:1.6;color:var(--ink);background:#fff;border:1px solid var(--line);border-top:4px solid var(--blue);padding:8px 14px;border-radius:12px}
.tip.good{border-top-color:var(--blue)}.tip.bad{border-top-color:var(--gold)}
.speaking{align-self:flex-start;color:var(--muted);font-size:18.2px;display:flex;gap:8px;align-items:center}
.wave{display:flex;gap:3px;align-items:end;height:16px}.wave i{width:3px;background:var(--accent);animation:w 0.9s infinite ease-in-out}
.wave i:nth-child(2){animation-delay:.1s}.wave i:nth-child(3){animation-delay:.2s}.wave i:nth-child(4){animation-delay:.3s}.wave i:nth-child(5){animation-delay:.4s}
@keyframes w{0%,100%{height:4px}50%{height:16px}}@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1}}
#choices{flex:none;border-top:1px solid var(--line);padding:12px 18px;display:grid;gap:8px;background:#fff;min-height:150px;max-height:60%;overflow-y:auto}
#choices .hint{color:var(--muted);font-size:16.8px}
#choices button{text-align:left;background:#fff;color:var(--ink);border:2px solid var(--lblue);border-radius:12px;padding:10px 14px;font-size:19.6px;line-height:1.6;cursor:pointer;font-family:inherit;transition:background .15s,border-color .15s}
#choices button:hover,#choices button.hl{border-color:var(--accent);background:var(--pinkbg)}
.side{padding:16px;background:#fff;border-left:1px solid var(--line);overflow-y:auto}
.meter{margin-bottom:16px}.meter .lbl{display:flex;justify-content:space-between;font-size:18.2px;margin-bottom:5px;color:var(--ink)}.meter .v{font-weight:700;color:var(--ink)}
.bar{height:10px;border-radius:5px;background:#edf0f2;overflow:hidden}.bar i{display:block;height:100%;transition:width .6s ease}
.meter:nth-child(1) .bar i{background:var(--blue)}.meter:nth-child(2) .bar i{background:var(--gold)}.meter:nth-child(3) .bar i{background:var(--accent)}
.counts{font-size:18.2px;color:var(--muted);line-height:1.9;border-top:1px solid var(--line);padding-top:10px}.counts b{color:var(--accent)}
.counts .ck{display:block;margin-bottom:10px}.counts .ck small{display:block}
footer{flex:none;background:var(--accent);color:#fff;font-size:12px;line-height:1.5;padding:4px 24px;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
html.embed footer{display:none}
#overlay{position:fixed;inset:0;background:rgba(31,29,30,.55);display:grid;place-items:center;z-index:9;padding:12px}
.card{width:min(960px,94vw);max-height:92vh;overflow-y:auto;background:#fff;border-radius:16px;padding:28px 32px;box-shadow:0 12px 40px rgba(31,29,30,.25);color:var(--ink)}
.card img.hero{width:100%;height:220px;object-fit:cover;object-position:center 40%;border-radius:16px;margin-bottom:14px;display:block;background:#fff}.rep img.hero{height:180px}
.card h2{margin:0 0 10px;font-size:36.4px;line-height:1.3;font-weight:700;color:var(--ink)}.card p{color:var(--ink);line-height:1.8;margin:8px 0}
.card button{margin-top:14px;background:var(--accent);color:#fff;border:0;border-radius:10px;padding:10px 24px;font-size:21px;font-weight:700;cursor:pointer;font-family:inherit}
.card button:hover{background:#a93a67}
.rep h3{margin:18px 0 6px;font-size:22.4px;font-weight:700;line-height:1.3;color:var(--accent)}
.rep table{width:100%;border-collapse:collapse;margin:10px 0;font-size:19.6px}.rep td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.rep .verdict{font-size:25.2px;font-weight:700;margin:6px 0;color:var(--accent)}
.goodcount{display:flex;align-items:baseline;gap:12px;margin:8px 0 4px}.goodcount .big{font-size:56px;font-weight:700;color:var(--accent);line-height:1.1}
.turns td{font-size:18.2px;line-height:1.6}.turns td:first-child{color:var(--accent);font-weight:700;width:1.6em}.turns td b{color:var(--accent)}
.assessment{display:inline-block;font-weight:700;margin:6px 0}.assessment.good{color:#256442}.assessment.review{color:#815514}.assessment.correct{color:#a32b42}
.alt,.adv{font-size:16.8px;margin-top:6px;padding:6px 10px;border-radius:8px}.alt{color:#1f6f8b;background:var(--bluebg)}.adv{color:var(--ink);background:#f6f4ee}
.fbbtn{background:var(--blue)!important;color:#fff!important;margin-right:8px}.fbbtn:hover{background:#2f8197!important}.small{font-size:16.8px;color:var(--muted);line-height:1.7}

@media (max-width:820px){
 html{background:#fff;height:auto;overflow-y:auto}body{max-width:none;box-shadow:none;height:auto;min-height:100dvh;overflow:visible;display:block}
 header{position:sticky;top:0;z-index:6;height:42px;padding:0 14px;align-items:center}
 header h1{font-size:17.2px;line-height:42px;white-space:nowrap}header .sub{display:none}
 main{display:flex;flex-direction:column;height:auto}
 aside{display:none}
 .side{order:0;position:sticky;top:42px;z-index:5;background:#fff;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:8px 14px 9px;border-left:0;border-bottom:1px solid var(--line);box-shadow:0 2px 6px rgba(0,0,0,.05)}
 .meter{margin:0}.meter .lbl{font-size:12.6px;display:flex;flex-direction:row;justify-content:space-between}.meter .lbl span:first-child{white-space:nowrap}
 .bar{height:7px}.counts{display:none}
 #chat{order:1;display:block;height:auto}
 #log{overflow:visible;height:auto;padding:12px 12px 6px;gap:10px}
 .msg{max-width:84%;font-size:17.2px;line-height:1.65;padding:8px 11px}.mini{width:28px;height:28px}
 .pcol{max-width:84%}.manner{font-size:13.8px}
 .tip{max-width:94%;font-size:14.4px}
 #choices{position:static;border-top:0;padding:4px 12px calc(16px + env(safe-area-inset-bottom));background:transparent;min-height:0;max-height:none;gap:6px}
 #choices .hint{font-size:13.8px;margin:2px 2px 0}
 #choices button{font-size:16.7px;padding:12px 14px;line-height:1.55}
 footer{display:none}
 .card{padding:16px 16px;border-radius:12px;max-height:calc(100dvh - 24px)}.card h2{font-size:21.8px}.card img.hero{height:150px}.rep img.hero{height:120px}
 .goodcount .big{font-size:40px}.rep table{font-size:14.4px}.turns td{font-size:14.4px}.alt,.adv{font-size:13.8px}
}
.speaking .skipbtn{margin:0 0 0 10px;padding:4px 14px;min-height:36px;font-size:15px;line-height:1.4;font-weight:700;background:#fff;color:var(--accent);border:1px solid var(--accent);border-radius:8px;text-align:center}

</style></head><body>
<header><h1 id="h-title">禁煙外来シミュレーター</h1><div class="sub">返答を選ぶと、患者さんが声で答えます</div></header>
<main>
 <aside><div class="who"><img class="av" id="pav-s" src="img/patient_neutral.webp" alt=""><div><b id="pname"></b><small id="pshort"></small></div></div><img id="pav" class="bigav" src="img/patient_neutral.webp" alt=""><div class="profile" id="profile"></div></aside>
 <section id="chat"><div id="log"></div><div id="choices"></div></section>
 <section class="side"><div id="meters"></div><div class="counts" id="counts"></div></section>
</main>
<footer>音声は Google Gemini 3.8 Flash TTS、イラストは Gemini 2.5 Flash Image で生成しました。 © 2026 Masahide Koda（東北大学 公衆衛生学分野）</footer>
<div id="overlay"><div class="card"><img class="hero" id="t-hero" src="img/title.webp" alt=""><h2 id="t-title">禁煙外来シミュレーター</h2><p id="t-intro"></p><button id="startbtn" disabled>面接をはじめる</button><p class="small" style="margin-top:12px">音声が流れます。スピーカーまたはイヤホンをご用意ください。</p></div></div>
<script>
// 分類・チェック項目・メーター・表情の規則・場面名は、すべて scenario.json から読む。
// 評価は「◎の数」と「状態フラグ」だけで決める。メーター、乱数、前回の結果は評価に使わない。
const Q=new URLSearchParams(location.search), DEMO=Q.get('demo'); // demo=good|earlysum|neutral|misinfo|poor
let S,SC,UI,CODE,MK,m,cur,hist,F,AV={},T0=performance.now();window.__clips=[];
const $=s=>document.querySelector(s), log=$('#log');
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const img=f=>UI.image_dir+f;
// 状態の初期化。開始のたびに必ずここを通る（前の回の値を持ち越さない）
function resetState(){m={...S.meters};hist=[];F={};cur=null;window.__clips=[];log.innerHTML='';$('#choices').innerHTML=''}
function buildMeters(){$('#meters').innerHTML=MK.map(k=>`<div class="meter" id="m-${k}"><div class="lbl"><span>${esc(S.meter_labels[k])}</span><span class="v"></span></div><div class="bar"><i></i></div></div>`).join('')}
const scenes=()=>SC.checklist, sceneOf=h=>scenes().findIndex(x=>h.node.startsWith(x.scene));
function setMeters(){for(const k of MK){m[k]=Math.max(0,Math.min(100,m[k]));$('#m-'+k+' i').style.width=m[k]+'%';$('#m-'+k+' .v').textContent=m[k]}
 $('#counts').innerHTML=scenes().map((x,i)=>{const h=hist.find(h=>h.node.startsWith(x.scene));return `<div class="ck"><b>場面${i+1}：${esc(x.name)}</b><small>${h?'選んだ返答：'+esc(SC.verdict_labels[h.c.verdict]):'未実施'}</small></div>`}).join('')}
function moodName(){for(const r of UI.mood_rules){const w=r.when||{};let ok=true;for(const [k,v] of Object.entries(w)){const i=k.lastIndexOf('_'),key=k.slice(0,i),op=k.slice(i+1);if(op==='min'&&!(m[key]>=v))ok=false;if(op==='max'&&!(m[key]<=v))ok=false}if(ok)return r.image}return 'neutral'}
function mood(){const f=moodName(),src=img(UI.portrait_prefix+f+'.webp'),im=$('#pav');if(!im.src.endsWith(UI.portrait_prefix+f+'.webp')){im.style.opacity=0;setTimeout(()=>{im.src=src;im.style.opacity=1},250)}return src}
const MOB=()=>matchMedia('(max-width:820px)').matches;function sb(){if(MOB())requestAnimationFrame(()=>window.scrollTo({top:document.documentElement.scrollHeight,behavior:'smooth'}))}
function add(cls,html){const d=document.createElement('div');d.className=cls;d.innerHTML=html;log.appendChild(d);log.scrollTop=log.scrollHeight;sb();return d}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
let AU=null;function unlockAudio(){if(AU)return;AU=new Audio();AU.playsInline=true;AU.src='data:audio/mp3;base64,SUQzBAAAAAAAI1RTU0UAAAAPAAADTGF2ZjU4Ljc2LjEwMAAAAAAAAAAAAAAA//tQxAADB8AhSmxhIIEVCSiJrDCQBTcu3UrAIwUdkRgQbFAZC1CQEwTJ9mjRvBA4UOLD8nKVOWfh+UlK3z/177OXrfOdKl7pyn3Xf//WreyTRUoAWgBgkOAGbZHBgG1OF6zM82DWbZaUmMBptgQhGjsyYqc9ae9XFz280948NMBWInljyzsNRFLPWdnZGWrddDsjK1unuSrVN9jJsK8KuQtQCtMBjCEtImISdNKJOopIpBFpNSMbIHCSRpRR5iakjTiyzLhchUUBwCgyKiweBv/7UsQbg8isVNoMPMjAAAA0gAAABEVFGmgqK////9bP/6XCykxBTUUzLjEwMKqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqq';AU.play().catch(()=>{})}
// 音声は audio/manifest.json にあるファイルだけを鳴らす。まだ作っていない音声は、表示だけ短く出して先へ進む
const au=f=>AV[f]?`audio/${f}?v=${(AV[f].md5||'').slice(0,12)}`:null;
function play(file,label){return new Promise(res=>{const src=au(file);window.__clips.push({file,src,t:(performance.now()-T0)/1000});
 const sp=add('speaking',`<span class="wave"><i></i><i></i><i></i><i></i><i></i></span>${esc(label)}<button type="button" class="skipbtn">音声を飛ばす</button>`);
 if(!src){setTimeout(()=>{sp.remove();res()},DEMO?300:700);return}
 unlockAudio();const a=AU;let done=false;const fin=ms=>{if(done)return;done=true;a.onended=null;a.onerror=null;setTimeout(()=>{sp.remove();res()},ms)};
 a.onended=()=>fin(0);a.onerror=()=>fin(800);sp.querySelector('.skipbtn').onclick=()=>{try{a.pause()}catch(e){}fin(0)};a.src=src;a.play().catch(()=>fin(800))})}
// 患者の発言: 【様子】（外から見える行動。音声にはしない）を先に出し、音声の後に台詞を出す
async function patientSay(file,text,manner){const row=add('row p',`<img class="mini" src="${mood()}" alt=""><div class="pcol">${manner?`<div class="manner">${esc(UI.manner_label||'【様子】')} ${esc(manner)}</div>`:''}</div>`);
 await play(file,UI.speaking_label);const d=document.createElement('div');d.className='msg p';d.textContent=text;row.querySelector('.pcol').appendChild(d);log.scrollTop=log.scrollHeight;sb()}
async function doctorSay(file,text,tag){add('row d',`<div class="msg d">${esc(text)}${tag?`<span class="tag">${esc(tag)}</span>`:''}</div><img class="mini" src="${img(UI.doctor_image)}" alt="">`);await play(file,UI.doctor_label)}
const goodN=()=>hist.filter(h=>h.c.verdict==='good').length;
function setFlags(c){for(const [k,f] of Object.entries(SC.flags)){if((f.set_by_codes||[]).includes(c.code))F[k]=true;if(f.set_by_verdict&&c.verdict===f.set_by_verdict)F[k]=true}}
function ending(){const g=goodN();for(const r of SC.ending.rules){if(r.good_min!=null&&g<r.good_min)continue;if(r.require_flags&&!Object.entries(r.require_flags).every(([k,v])=>!!F[k]===v))continue;return r.end}return SC.ending.rules.at(-1).end}
function endText(n){let t=n.patient,idx=-1,mn=n.manner;(n.patient_variants||[]).forEach((v,i)=>{if(idx<0&&Object.entries(v.when).every(([k,val])=>!!F[k]===val)){idx=i;t=v.text;mn=v.manner||n.manner}});return [t,idx,mn]}
async function showNode(id){cur=id;const n=S.nodes[id];
 if(n.end){if(n.meters){m={...n.meters};setMeters();mood()} // 結末のノードは、結末ごとに決まったメーター値を持つ
  const [t,i,mn]=endText(n);await patientSay(`${id}${i>=0?'_v'+i:''}.mp3`,t,mn);return report(id)}
 await patientSay(`${id}.mp3`,n.patient,n.manner);
 const box=$('#choices');box.innerHTML='<div class="hint">返答を選んでください（タップ／クリック）</div>';
 n.choices.forEach((c,i)=>{const b=document.createElement('button');b.textContent=c.label;b.onclick=()=>choose(i);box.appendChild(b)});sb();
 requestAnimationFrame(()=>{log.scrollTop=log.scrollHeight}); // 選択肢が出て会話欄が狭くなった後も、直前の患者の発言が見えるようにする
 if(DEMO){const pick=(S.demo&&S.demo[DEMO]||{})[id];await sleep(1600);const bs=box.querySelectorAll('button');const i=pick??0;bs[i].classList.add('hl');await sleep(1100);choose(i)}}
async function choose(i){if(cur==null)return;const node=cur,n=S.nodes[node],c=n.choices[i];cur=null;$('#choices').innerHTML='';
 hist.push({node,i,c});setFlags(c);
 await doctorSay(`${node}_c${i}.mp3`,c.label,CODE[c.code]);
 for(const k in c.delta)m[k]+=c.delta[k];setMeters();mood();
 add('tip '+(c.verdict==='good'?'good':'bad'),esc(SC.verdict_marks[c.verdict])+' '+esc(c.feedback));
 await sleep(DEMO?1800:900);
 if(c.next==='END'){if(S.closing){await doctorSay('closing_doctor.mp3',S.closing.doctor,'');await patientSay('closing_patient.mp3',S.closing.patient,S.closing.manner)}showNode(ending())}else showNode(c.next)}
function srcText(x){const s=x.source||{};return Object.entries(SC.source_kinds).filter(([k])=>s[k]).map(([k,l])=>`${esc(l)}：${esc(s[k])}`).join('<br>')}
function report(id){const n=S.nodes[id],ek=n.end,g=goodN(),N=scenes().length;
 const rows=scenes().map((x,i)=>{const h=hist.find(h=>h.node.startsWith(x.scene));if(!h)return '';const c=h.c;let alt='';
   if(c.verdict!=='good'){const best=S.nodes[h.node].choices.filter(y=>y.verdict==='good')[0];if(best)alt=`<div class="alt">${esc(UI.alt_label)}：「${esc(best.label)}」</div>`}
   const adv=c.advanced?`<div class="adv">${esc(UI.advanced_label)}：${esc(c.advanced)}</div>`:'';
   return `<tr><td>${i+1}</td><td><b>場面${i+1}：${esc(x.name)}</b><br><span class="assessment ${c.verdict}">${esc(SC.verdict_marks[c.verdict])} ${esc(SC.verdict_labels[c.verdict])}</span>　${esc(c.verdict==='good'?c.did:(c.revisit||''))}<br><span class="small">選んだ返答「${esc(c.label)}」<br>${esc(c.feedback)}</span>${alt}${adv}<div class="small">${srcText(x)}</div></td></tr>`}).join('');
 const corr=hist.filter(h=>h.c.verdict==='correct');
 const corrHtml=corr.length?`<h3>${esc(UI.correct_heading)}</h3><p>${corr.map(h=>'「'+esc(h.c.label)+'」<br><span class="small">'+esc(h.c.revisit||'')+'</span>').join('<br>')}</p>`:'';
 const voice=`feedback_${ek}.mp3`;
 $('#overlay').innerHTML=`<div class="card rep" data-end="${esc(id)}" data-good="${g}"><img class="hero" src="${img(UI.end_image_prefix+id+'.webp')}" alt=""><h2>${esc(UI.report_heading)}</h2><div class="verdict">${esc(n.title)}</div>
 <div class="goodcount"><span class="big">${g}</span><span>/ ${N}　${esc(UI.good_count_label)}</span></div>
 <p>${esc(S.feedback_voice[ek]||'')}</p>
 ${corrHtml}
 <h3>場面ごとの振り返り</h3><p class="small">${esc(UI.legend)}</p><table class="turns">${rows}</table>
 <button class="fbbtn" id="again-voice">講評をもう一度聞く</button><button id="retry">もう一度</button></div>`;
 $('#overlay').style.display='grid';
 const say=()=>{const s=au(voice);window.__clips.push({file:voice,src:s,t:(performance.now()-T0)/1000});if(!s)return;unlockAudio();AU.onended=null;AU.onerror=null;AU.src=s;AU.play().catch(()=>{})};
 $('#again-voice').onclick=say;
